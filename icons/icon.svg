<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#110E28"/>
      <stop offset="100%" stop-color="#090714"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#7C6EFA"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle App Icon Background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="#3730A3" stroke-width="4"/>

  <!-- Glowing Aura -->
  <circle cx="256" cy="256" r="140" fill="#7C6EFA" opacity="0.22" filter="url(#glow)"/>

  <!-- Branded ✦ Four-Point Star Sparkle -->
  <path d="M 256 76 C 256 186 286 226 406 256 C 286 286 256 326 256 436 C 256 326 226 286 106 256 C 226 226 256 186 256 76 Z" 
        fill="url(#starGrad)" filter="url(#glow)"/>
</svg>